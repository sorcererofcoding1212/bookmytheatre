{% extends 'layouts/navLayout.html' %} {% block children %}
<div class="pt-10">
  <div class="px-32">
    <div class="text-2xl font-semibold text-rose-500">Recommended Movies</div>
    <div class="grid grid-cols-5 gap-x-8 pt-4">
      {% for movie in movies %}
      <a href="{% url 'movies:movie' movie.id %}" class="cursor-pointer">
        <div class="h-96 hover:scale-102 transition-all">
          <img
            class="w-full h-full object-cover rounded-2xl"
            src="{{ movie.image }}"
            alt="{{ movie.title }}"
          />
        </div>
        <div class="mt-4 font-medium text-lg">{{movie.title}}</div>
        <div class="font-medium text-base opacity-80">
          {% for tag in movie.genres.all %}
          <span>{{ tag }}{% if not forloop.last %}/{% endif %}</span>
          {% endfor %}
        </div>
      </a>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock children %}
